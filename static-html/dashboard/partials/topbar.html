<header class="app-topbar sticky top-0 z-10 flex items-center gap-4 px-6 py-3.5">
  <button class="btn-ghost btn p-2 lg:hidden" aria-label="Toggle menu" data-sidebar-toggle>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <div class="relative flex-1 max-w-md">
    <svg class="absolute left-3 top-1/2 -translate-y-1/2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--muted-foreground)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
    <input type="search" placeholder="Search leads, properties, calls..." class="field-input pl-9" style="background-color:var(--muted); border-color:transparent">
  </div>

  <button class="btn-secondary btn text-sm" id="data-page-title-action" style="display:none"></button>

  <button class="relative p-2 rounded-lg" style="color:var(--muted-foreground)" aria-label="Notifications">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full" style="background-color:var(--destructive)"></span>
  </button>

  <div class="flex items-center gap-2.5 pl-3" style="border-left:1px solid var(--border)">
    <img src="https://i.pravatar.cc/64?img=47" alt="" class="w-8 h-8 rounded-full object-cover">
    <div class="hidden sm:block leading-tight">
      <p class="text-sm font-medium">Petros A.</p>
      <p class="text-xs" style="color:var(--muted-foreground)">Agency Admin</p>
    </div>
  </div>
</header>
